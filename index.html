/* Christmas styling */
:root{--wine:#370817;--rose:#ba1747;--pink:#ef4770;--gold:#ffd98a}
body{background:#240811}
body:before{background:radial-gradient(ellipse at 12% 8%,#8c153d 0%,transparent 48%),radial-gradient(ellipse at 88% 60%,#5b1127 0%,transparent 50%),linear-gradient(155deg,#3a0819,#1e0912)}
header{background:#390819d9;border-bottom:1px solid #f8dca82b}
.mark{background:linear-gradient(145deg,#a10058,#5d0042);color:#ffcb24;font-family:Outfit;font-weight:900;font-size:30px;border-radius:11px;line-height:1}
.meesho-word{letter-spacing:-1.3px;font-weight:900}
.hero{padding:85px 0 50px;isolation:isolate}
.hero:before{content:'🎄';position:absolute;left:1%;top:20px;font-size:clamp(75px,14vw,185px);filter:drop-shadow(0 20px 30px #0009);opacity:.85;z-index:-1}
.hero:after{content:'🎁';position:absolute;right:3%;top:35px;font-size:clamp(70px,12vw,150px);filter:drop-shadow(0 20px 30px #0009);z-index:-1}
.eyebrow{border-color:#e9bd745e;background:#b82c3a38;color:#ffe1a6}
.hero h1 span{background:linear-gradient(90deg,#ffb1c4,#fff2c3,#eec06e);background-clip:text;-webkit-background-clip:text}
.panel{border-color:#dca15d5e;background:linear-gradient(145deg,#8c17302c,#380c19b3)}
.tile{border-color:#f6bc8d55;background:radial-gradient(circle at 50% 20%,#d32c4a44,transparent 70%),linear-gradient(145deg,#690e2b,#370c20)}
.tile:hover{border-color:#ffdc8c;box-shadow:0 13px 35px #f7b75625}
.gift-body{background:linear-gradient(115deg,#db274e,#a90737 60%,#740b29)}
.gift-lid{background:linear-gradient(115deg,#ed4569,#bf1743 70%,#8e0c34)}
.ribbon-v{background:linear-gradient(90deg,#b67a25,#fff0a6,#d79b38)}
.bow{font-size:35px;top:-8px}
.question{color:#fff1b2}
.num{background:#c62b4c3d;border-color:#ffdc925b;color:#ffe5b2}
.tap{color:#fff0c8}
.tile.revealed{background:linear-gradient(145deg,#792038,#340e1d)}
@media(max-width:680px){.hero{padding:64px 0 32px}.hero:before,.hero:after{opacity:.23}.brand{gap:7px}.meesho-word{font-size:21px}}
</style></head><body><header><div class="wrap nav"><div class="brand"><span class="mark">m</span> <span class="meesho-word">meesho</span></div><a href="#boxes">Explore Boxes ↗</a></div></header><main class="wrap"><section class="hero"><div class="eyebrow">❄ Christmas Special ❄</div><h1>Christmas<br><span>Mystery Box</span></h1><p>Nine festive gifts. Pick any box and discover what’s inside!</p><div class="stats"><span><i class="dot"></i> 9 mystery boxes</span><span><i class="dot"></i> Tap to reveal</span></div></section><section class="panel" id="boxes"><div class="panel-head"><h2>🎄 Choose a Christmas gift</h2><small id="counter">0 boxes opened</small></div><div class="grid" id="grid"></div></section></main><footer>Christmas Mystery Box · A festive fan-made experience</footer><div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="Coupon poster"><div class="dialog"><button class="close" id="close" aria-label="Close">×</button><h3>🎉 Your Second Reveal!</h3><img src="assets/poster.webp" alt="Meesho themed ₹5000 mock coupon poster with two women"></div></div><script>
const grid=document.querySelector('#grid'),modal=document.querySelector('#modal');
let revealCount=0;
for(let i=1;i<=9;i++){
 const b=document.createElement('button');b.type='button';b.className='tile';b.setAttribute('aria-label','Reveal mystery box '+i);
 b.innerHTML=`<span class="num">MYSTERY BOX ${String(i).padStart(2,'0')}</span><div class="gift" aria-hidden="true"><div class="gift-body"></div><div class="gift-lid"></div><div class="ribbon-v"></div><div class="bow">🎀</div><div class="question">?</div></div><span class="tap">Tap to reveal →</span><div class="result" aria-live="polite"></div>`;
 b.addEventListener('click',()=>{
   if(b.classList.contains('revealed')){if(b.dataset.prize==='poster')modal.classList.add('show');return;}
   revealCount++;
   const result=b.querySelector('.result');
   if(revealCount===1){result.innerHTML='<span class="emoji">📦</span><strong>It’s empty!</strong><p>Try another mystery box 💗</p>';b.dataset.prize='empty';}
   else if(revealCount===2){result.innerHTML='<img src="assets/poster.webp" alt="Fictional ₹5000 Meesho themed coupon poster"><span class="poster-label">Tap again to view poster ↗</span>';b.dataset.prize='poster';}
   else{result.innerHTML='<span class="emoji">🎄</span><strong>Coming soon</strong><p>All surprises revealed for now!</p>';b.dataset.prize='later';}
   b.classList.add('revealed');b.setAttribute('aria-label','Opened mystery box '+i);
   document.querySelector('#counter').textContent=`${revealCount} of 9 opened`;
   if(revealCount===2)setTimeout(()=>modal.classList.add('show'),650);
 });grid.appendChild(b);
}
document.querySelector('#close').onclick=()=>modal.classList.remove('show');
modal.onclick=e=>{if(e.target===modal)modal.classList.remove('show')};
document.addEventListener('keydown',e=>{if(e.key==='Escape')modal.classList.remove('show')});
</script></body></html>
